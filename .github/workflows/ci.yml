name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Тесты проверяют наличие .env.local; реальные ключи в CI не нужны.
      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://ci-project.supabase.co" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key" >> .env.local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
